<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ChatBox Ristorante</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <header>
        <!-- Logo a sinistra con forchetta e coltello -->
        <div class="header-left">
            <div class="logo">
                <i class="fa-solid fa-utensils"></i>
            </div>
        </div>
        <!-- Nome del ristorante al centro -->
        <div class="header-center">
            <h1 class="restaurant-name">Osteria Al Casale</h1>
            <h3>Assistente prenotazioni - <span class="contact-status">Online 🟢</span></h3>
        </div>
        <!-- Icone a destra -->
        <div class="header-right">
            <i class="bi bi-search"></i>
            <i class="bi bi-journal-medical"></i>
            <i class="bi bi-three-dots"></i>
        </div>
    </header>
    <!-- Box delle chat -->
    <div id="chat-box">
        <!-- Qui, i messaggi li mette JS -->

			<div class="chat-message">

				</time>
			</div>
		</div>

		<div class="chat-row received">
			<div class="chat-message">

			</div>

    </div>

    <!-- Fondo pagina -->
    <footer>
        <input type="text" placeholder="Scrivi qui..." autocomplete="off" />
        <button>
            <i class="bi bi-arrow-up-circle-fill"></i>
        </button>
    </footer>


    <script src="secret.js"></script>

    <script src="main.js"></script>



</body>

</html>
